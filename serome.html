<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <link rel="stylesheet" href="serome.css">
</head>
<body>

    <div class="container">

        <form class="contact-form">

            <h2>Contact Us</h2>

            <!-- First and Last Name -->
            <div class="name-fields">

                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text">
                </div>

            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email">
            </div>

            <!-- Query Type -->
            <div class="form-group">
                <label>Query Type *</label>

                <div class="query-options">

                    <label class="radio-box">
                        <input type="radio" name="query">
                        General Enquiry
                    </label>

                    <label class="radio-box">
                        <input type="radio" name="query">
                        Support Request
                    </label>

                </div>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label>Message *</label>
                <textarea></textarea>
            </div>

            <!-- Checkbox -->
            <div class="consent">
                <input type="checkbox">
                <label>I consent to being contacted by the team *</label>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
